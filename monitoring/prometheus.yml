global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "gateway"
    static_configs:
      - targets: ["gateway:8000"]
    metrics_path: "/metrics"

  - job_name: "vllm-llm"
    static_configs:
      - targets: ["vllm-llm:8001"]

  - job_name: "vllm-vision"
    static_configs:
      - targets: ["vllm-vision:8002"]

  - job_name: "vllm-coding"
    static_configs:
      - targets: ["vllm-coding:8003"]

  - job_name: "vllm-embedding"
    static_configs:
      - targets: ["vllm-embedding:8004"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres:9187"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis:9121"]
